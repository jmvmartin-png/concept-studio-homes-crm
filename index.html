<meta name="theme-color" content="#16202c">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="https://rvuoqfsuswjnyytvitqb.supabase.co/storage/v1/object/public/csh-public/icon-192.png">

<body>

<section id="login" class="hidden">
  <div class="login-card">
    <img class="logo" src="https://rvuoqfsuswjnyytvitqb.supabase.co/storage/v1/object/public/csh-public/logo.png" alt="Concept Studio Homes">
    <div class="sub">CRM INMOBILIARIO</div>
    <div class="tabs"><button data-m="in" class="on">Entrar</button><button data-m="up">Crear acceso</button><button data-m="re">Olvidé clave</button></div>
    <form id="loginForm">
      <div class="fld" style="margin-bottom:12px"><label>Email del equipo</label><input type="email" name="email" required autocomplete="email" placeholder="nombre@email.com"></div>
      <div class="fld" id="pwFld" style="margin-bottom:16px"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" minlength="6"></div>
      <button class="btn pri" style="width:100%;justify-content:center;padding:14px" id="loginBtn">Entrar</button>
      <div class="login-msg" id="loginMsg"></div>
      <p class="small muted" style="margin:10px 0 0;text-align:center">Acceso reservado a Jesús M.V. y Jesús Romero.</p>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><img src="https://rvuoqfsuswjnyytvitqb.supabase.co/storage/v1/object/public/csh-public/logo.png" alt="Concept Studio Homes"></div>
    <div class="brand-sub">CRM INMOBILIARIO</div>
    <nav class="nav" id="nav"></nav>
    <div class="sync" id="syncState"><span class="dot"></span> Sincronizado</div>
    <div class="side-user" id="sideUser"></div>
  </aside>
  <main class="main">
    <header class="mob-head">
      <img src="https://rvuoqfsuswjnyytvitqb.supabase.co/storage/v1/object/public/csh-public/logo.png" alt="Concept Studio Homes">
      <div class="ttl" id="mobTitle">Dashboard</div>
      <button class="bell" id="mobBell" aria-label="Avisos"></button>
    </header>
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="actions" id="pageActions"></div></div>
    <div class="content" id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" id="fab" aria-label="Nuevo"></button>
</div>

<script src="vendor/supabase.js"></script>
<script src="js/core.js?v=3.1.4"></script>
<script src="js/views.js?v=3.1.4"></script>
<script src="js/forms.js?v=3.1.4"></script>
</body>
</html>
